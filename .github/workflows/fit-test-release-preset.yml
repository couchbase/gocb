name: Run FIT Testing (Release preset)

on:
  schedule:
    - cron: '0 20 * * FRI'

  workflow_dispatch:
    inputs:
      performer_tag:
        description: Tag of the go-fit-performer image to test against.
        required: false
        type: string
        default: main

permissions:
  id-token: write
  contents: read
  checks: write

jobs:
  fit:
    uses: ./.github/workflows/fit-test.yml
    with:
      preset: ${{ vars.FIT_CLI_RELEASE_PRESET || 'op-multi-release' }}
      performer_tag: ${{ inputs.performer_tag }}

name: Validate FIT Performer
permissions: {}

on:
  push:
    branches:
      - master
      - v2.*

  pull_request:
    branches:
      - master
      - v2.*

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: 1.25

      - uses: arduino/setup-protoc@v3
        with:
          version: 35.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          make performer-devsetup
          make performer-lint

  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.event_name != 'push'  # The publish-fit-performer workflow will build the image on push events.

    steps:
      - uses: actions/checkout@v6

      - run: |
          docker build -f internal/cmd/fit-performer/Dockerfile .

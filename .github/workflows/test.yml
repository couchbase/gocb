name: Test
permissions: {}

on:
  push:
    branches:
      - master
      - v2.*

  pull_request:
    branches:
      - master
      - v2.*

  workflow_dispatch:
    inputs:
      go-version:
        description: 'Go version to use for testing.'
        required: false

      minimum-go-version:
        description: 'Minimum Go version supported by the SDK.'
        required: false

      ref:
        description: 'The branch, tag or SHA to checkout.'
        required: false

jobs:
  mock-test:
    name: Mock Tests
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025-vs2026
          - windows-11-arm
          - macos-26-intel
          - macos-26

        go-version:
          - &go-version ${{ inputs.go-version || '1.27' }}

        include:
          - runner: ubuntu-24.04
            go-version: ${{ inputs.minimum-go-version || '1.25' }}

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Run tests
        shell: bash
        run: |
          go install gotest.tools/gotestsum@v1.13.0
          RACE=""
          if [[ "${{ matrix.runner }}" != "windows-11-arm" ]]; then
            RACE="-race"
          fi
          gotestsum --format standard-verbose --junitfile TEST-report.xml -- -v $RACE ./

      - name: Publish test results
        shell: bash
        if: ${{ !cancelled() }}
        run: |
          curl https://raw.githubusercontent.com/couchbaselabs/junit-markdown/refs/heads/main/JunitMarkdown.java --output "$RUNNER_TEMP/JunitMarkdown.java"
          java "$RUNNER_TEMP/JunitMarkdown.java" --format=passthrough . >> $GITHUB_STEP_SUMMARY

  integration-test:
    name: Integration Tests

    strategy:
      fail-fast: false
      matrix:
        server:
          - 8.5-stable
          - 8.0-stable
          - 8.0-release
          - 7.6-stable
          - 7.6-release
          - 7.2-release

    runs-on: ubuntu-24.04

    permissions:
      packages: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version: *go-version
          cache: false

      - name: Resolve server version
        uses: couchbaselabs/sdk-resolve-cb-alias-action@v1
        id: resolve-server
        with:
          alias: ${{ matrix.server }}

      - name: Create cluster
        uses: ./.github/actions/create-cluster
        id: create-cluster
        with:
          version: ${{ steps.resolve-server.outputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        id: run-tests
        shell: bash
        run: |
          go install gotest.tools/gotestsum@v1.13.0
          gotestsum --format standard-verbose --junitfile TEST-report.xml -- -v -race ./
        env:
          GOCBSERVER: ${{ steps.create-cluster.outputs.connstr }}
          GOCBUSER: Administrator
          GOCBPASS: password
          GOCBVER: ${{ steps.resolve-server.outputs.version }}

      - name: Publish test results
        shell: bash
        if: ${{ !cancelled() }}
        run: |
          curl https://raw.githubusercontent.com/couchbaselabs/junit-markdown/refs/heads/main/JunitMarkdown.java --output "$RUNNER_TEMP/JunitMarkdown.java"
          java "$RUNNER_TEMP/JunitMarkdown.java" --format=passthrough . >> $GITHUB_STEP_SUMMARY
